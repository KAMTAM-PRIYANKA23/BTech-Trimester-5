services:
  backend:
    build: ./backend
    container_name: cloud-cicd-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: host.docker.internal
      PORT: 5000
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: cloud-cicd-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
