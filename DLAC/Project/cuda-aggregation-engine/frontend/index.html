<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1626" />
    <script>
      /* Apply the saved theme before first paint so a refresh never flashes the wrong one. Default: dark. */
      (function () {
        var t = "dark";
        try { var s = localStorage.getItem("reductionlab.theme"); if (s === "light" || s === "dark") t = s; } catch (e) {}
        var r = document.documentElement;
        r.setAttribute("data-theme", t);
        r.style.colorScheme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "dark" ? "#0b1626" : "#f3efe6");
      })();
    </script>
    <title>Reduction Lab - CUDA GPU aggregation</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>

  </body>
</html>
